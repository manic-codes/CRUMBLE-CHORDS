<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 74" width="350" height="74">
  <defs>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <style>
      .logo-title { font-family: 'Cormorant Garamond', 'Playfair Display', Georgia, serif; font-size: 28px; font-weight: 700; fill: #fff7ed; letter-spacing: 3px; }
      .logo-sub { font-family: 'Inter', system-ui, sans-serif; font-size: 8.5px; font-weight: 700; fill: #fbbf24; letter-spacing: 4.5px; text-transform: uppercase; }
    </style>
  </defs>
  
  <!-- Glowing Amber Emblem -->
  <g transform="translate(12, 10)">
    <circle cx="26" cy="26" r="25" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1" fill="#1d1612"/>
    <circle cx="26" cy="26" r="22" stroke="url(#amberGold)" stroke-width="1.4" stroke-dasharray="3 3" fill="none"/>
    <circle cx="26" cy="26" r="19" stroke="rgba(251, 191, 36, 0.4)" stroke-width="0.8" fill="none"/>
    
    <!-- Stylized Wheat Sheaf / Whisk -->
    <path d="M 26 40 L 26 12" stroke="#fde68a" stroke-width="2" stroke-linecap="round"/>
    
    <ellipse cx="23" cy="18" rx="2.5" ry="5.5" transform="rotate(-30 23 18)" fill="url(#amberGold)"/>
    <ellipse cx="29" cy="18" rx="2.5" ry="5.5" transform="rotate(30 29 18)" fill="url(#amberGold)"/>
    <ellipse cx="22" cy="26" rx="2.5" ry="5.5" transform="rotate(-30 22 26)" fill="url(#amberGold)"/>
    <ellipse cx="30" cy="26" rx="2.5" ry="5.5" transform="rotate(30 30 26)" fill="url(#amberGold)"/>
    <ellipse cx="26" cy="13" rx="2" ry="4" fill="#fde68a"/>
    <circle cx="26" cy="40" r="2.2" fill="#fbbf24"/>
  </g>

  <!-- Typography with Gold Glow -->
  <text x="74" y="38" class="logo-title">CRUMBLE CHORDS</text>
  <text x="76" y="55" class="logo-sub">CLASSIC BAKERY RECIPES</text>
  <line x1="76" y1="44" x2="310" y2="44" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
  <circle cx="193" cy="44" r="1.8" fill="#fbbf24"/>
</svg>
